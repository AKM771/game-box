<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>别踩白块 — 小游戏合集</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f6;color:#1b1b1e;font:16px/1.6 -apple-system,"Segoe UI",system-ui,"Microsoft YaHei",sans-serif;text-align:center}
.top{padding:14px}
.top a{color:#2f5596;text-decoration:none;font-size:14px}
h1{font-size:20px;margin:10px 0 6px}
.info{color:#55555c;font-size:14px;margin:6px 0 10px}
.mv{margin-bottom:6px}
.mv button{font:inherit;font-size:13px;padding:5px 12px;margin:0 2px;border:1px solid #c9c9ce;background:#fff;border-radius:6px;cursor:pointer}
.mv button.on{background:#1b1b1e;color:#fff;border-color:#1b1b1e}
canvas{background:#fff;border:1px solid #d9d9dd;border-radius:10px;max-width:94vw;touch-action:none;-webkit-user-select:none;user-select:none}
.msg{min-height:22px;color:#2f5596;font-weight:600;margin:12px 0 4px}
.tip{color:#6b6b70;font-size:13px;margin-top:6px}
</style>
</head>
<body>
<div class="top"><a href="index.html">← 小游戏合集</a></div>
<h1>别踩白块</h1>
<p class="info">分数 <b id="score">0</b> · 最高 <b id="best">0</b> <span id="timebox"></span></p>
<div class="mv" id="mode">
  <button data-m="classic" class="on">经典（越打越快）</button>
  <button data-m="rush">限时 60 秒</button>
</div>
<div class="mv" id="diff">
  <button data-d="0">慢速</button>
  <button data-d="1" class="on">中速</button>
  <button data-d="2">快速</button>
</div>
<canvas id="cv" width="400" height="560"></canvas>
<p class="msg" id="msg">点黑块开始 · 白块千万别碰</p>
<p class="tip">点/轻触黑块（手机四列直接戳）· 键盘 1/2/3/4 对应四列 · 踩白块或漏黑块就结束 · R 重开</p>
<script>
(function(){
"use strict";
var W=400,H=560,COLS=4,CW=W/COLS,RH=112;
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var scoreEl=document.getElementById("score"),bestEl=document.getElementById("best"),
    msgEl=document.getElementById("msg"),timebox=document.getElementById("timebox");
var mode="classic",diff=1;
var rows,score,best,over,started=false,run=false,frames=0,rushLeft=0,lastSpawnY=0,raf=null;

function bestKey(){return "piano_best_"+mode+"_"+diff;}
function loadBest(){try{best=parseInt(localStorage.getItem(bestKey())||"0",10)||0;}catch(e){best=0;}bestEl.textContent=best;}
function saveBest(){if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem(bestKey(),String(best));}catch(e){}}}
// 速度：基础 + 随分数增益，三档差异
function speedNow(){
  var base=[3.0,4.4,6.2][diff];
  var gain=[0.02,0.035,0.055][diff];
  var s=base+score*gain;
  return Math.min(s,[7.5,9.5,12][diff]);
}
function reset(){
  rows=[];score=0;over=false;started=false;run=false;frames=0;lastSpawnY=0;
  scoreEl.textContent="0";
  msgEl.textContent="点黑块开始 · 白块千万别碰";
  loadBest();
  spawnRow(RH*3);spawnRow(RH*2);spawnRow(RH);spawnRow(0);spawnRow(-RH);   // 下→上排：index0=最底(先落出)，rows[last]=最顶(新行续在其上方)
  if(mode==="rush"){rushLeft=60;timebox.innerHTML=" · 剩余 <b>60</b>s";draw();}
}
function spawnRow(y){
  rows.push({y:y,black:Math.floor(Math.random()*COLS),judged:false,flash:0});
  lastSpawnY=y;
}
function topY(){return rows.length?rows[rows.length-1].y:-RH;}
function ensureRows(){
  while(topY()>-RH*2)spawnRow(topY()-RH);
}
function judge(row,col){
  if(!run){startRun();}
  if(row.judged)return;
  if(col===row.black){
    row.judged=true;row.flash=1;
    score++;scoreEl.textContent=score;
    if(mode==="rush"&&score%10===0)saveBest();   // 限时模式中途也记
    if(mode==="classic")saveBest();
  }else{
    die("踩到白块了 · "+score+" 分 · R 重开");
  }
}
function die(msg){
  over=true;run=false;
  saveBest();
  msgEl.textContent=msg;
}
function startRun(){run=true;started=true;}
function tap(x,y){
  if(over)return;
  var col=Math.floor(x/CW);
  if(col<0||col>=COLS)return;
  // 找包含点击 y 的最底未判定行
  for(var i=0;i<rows.length;i++){
    var r=rows[i];
    if(y>=r.y&&y<r.y+RH){judge(r,col);return;}
  }
}
function loop(){
  raf=requestAnimationFrame(loop);
  frames++;
  if(over){draw();return;}
  if(!run){draw();return;}
  var sp=speedNow();
  for(var i=0;i<rows.length;i++){
    rows[i].y+=sp;
    if(rows[i].flash>0)rows[i].flash-=0.06;
  }
  // 漏黑块判定：整行落到屏幕下方
  for(i=0;i<rows.length;i++){
    if(!rows[i].judged&&rows[i].y>H){
      die("漏了黑块 · "+score+" 分 · R 重开");
      break;
    }
  }
  // 清理掉底的行
  while(rows.length&&rows[0].y>H+RH)rows.shift();
  ensureRows();
  if(mode==="rush"){
    if(frames%60===0){   // 约 1 秒（60fps）
      rushLeft--;
      var tb=timebox.querySelector("b");
      if(tb)tb.textContent=Math.max(0,rushLeft);
      if(rushLeft<=0){
        saveBest();
        over=true;run=false;
        msgEl.textContent="时间到！"+score+" 分（"+["慢","中","快"][diff]+"速）· R 重开";
      }
    }
  }
  draw();
}
function draw(){
  // 白底+竖线
  ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="#e0e0e0";ctx.lineWidth=2;
  for(var c=1;c<COLS;c++){ctx.beginPath();ctx.moveTo(c*CW,0);ctx.lineTo(c*CW,H);ctx.stroke();}
  // 行：底条 + 黑块
  for(var i=0;i<rows.length;i++){
    var r=rows[i];
    if(r.y>H||r.y+RH<0)continue;
    var by=Math.max(0,r.y),bh=Math.min(r.y+RH,H)-by;
    if(bh<=0)continue;
    // 行底条
    ctx.fillStyle=r.judged?"#e8f5e9":"#f5f5f5";
    ctx.fillRect(0,by,W,bh);
    // 黑块 / 已答绿块
    if(r.judged){
      ctx.fillStyle=r.flash>0?"#a5d6a7":"#c8e6c9";
      ctx.fillRect(r.black*CW,by,CW,bh);
    }else{
      ctx.fillStyle="#1b1b1e";
      ctx.fillRect(r.black*CW,by,CW,bh);
      // 最新的待答行给个下箭头提示
      if(r.y<H&&r.y>-RH*1.2){
        ctx.fillStyle="rgba(255,255,255,.5)";
        ctx.beginPath();
        ctx.moveTo(r.black*CW+CW/2,by+14);
        ctx.lineTo(r.black*CW+CW/2-8,by+28);
        ctx.lineTo(r.black*CW+CW/2+8,by+28);
        ctx.closePath();ctx.fill();
      }
    }
    // 行分隔线
    if(r.y>=0){
      ctx.strokeStyle="#ddd";ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(0,r.y);ctx.lineTo(W,r.y);ctx.stroke();
    }
  }
  if(!started&&!over){
    ctx.fillStyle="rgba(0,0,0,.35)";ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#fff";ctx.textAlign="center";
    ctx.font="bold 24px sans-serif";ctx.fillText("点最下面的黑块",W/2,H/2);
  }
  if(over){
    ctx.fillStyle="rgba(0,0,0,.5)";ctx.fillRect(0,0,W,H);
  }
}
cv.addEventListener("mousedown",function(e){
  if(over){reset();return;}
  var rect=cv.getBoundingClientRect();
  tap((e.clientX-rect.left)*(W/rect.width),(e.clientY-rect.top)*(H/rect.height));
});
cv.addEventListener("touchstart",function(e){
  if(over){reset();e.preventDefault();return;}
  var rect=cv.getBoundingClientRect();
  var t=e.touches[0];
  tap((t.clientX-rect.left)*(W/rect.width),(t.clientY-rect.top)*(H/rect.height));
  e.preventDefault();
},{passive:false});
document.addEventListener("keydown",function(e){
  if(e.key==="r"||e.key==="R"){reset();return;}
  var k={"1":0,"2":1,"3":2,"4":3}[e.key];
  if(k!==undefined&&!over){
    // 对准最底未判定行
    for(var i=0;i<rows.length;i++){
      if(!rows[i].judged&&rows[i].y<H&&rows[i].y+RH>0){judge(rows[i],k);break;}
    }
    e.preventDefault();
  }
});
function bind(id,fn){
  var btns=document.querySelectorAll("#"+id+" button");
  for(var i=0;i<btns.length;i++){
    btns[i].addEventListener("click",function(){
      for(var j=0;j<btns.length;j++)btns[j].classList.remove("on");
      this.classList.add("on");
      fn(this.getAttribute(id==="mode"?"data-m":"data-d"));
      reset();
    });
  }
}
bind("mode",function(v){mode=v;timebox.innerHTML=(v==="rush")?" · 剩余 <b>60</b>s":"";});
bind("diff",function(v){diff=+v;});
reset();
loop();
})();
</script>
</body>
</html>

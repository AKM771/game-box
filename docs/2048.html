<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2048 — 小游戏合集</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f6;color:#1b1b1e;font:16px/1.6 -apple-system,"Segoe UI",system-ui,"Microsoft YaHei",sans-serif;text-align:center}
.top{padding:14px}
.top a{color:#2f5596;text-decoration:none;font-size:14px}
h1{font-size:20px;margin:10px 0 6px}
.info{color:#55555c;font-size:14px;margin:6px 0 14px}
#board{display:inline-grid;grid-template-columns:repeat(4,84px);grid-template-rows:repeat(4,84px);gap:10px;background:#bbada0;padding:10px;border-radius:10px;touch-action:none}
.cell{background:rgba(238,228,218,.35);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:30px}
.c2{background:#eee4da;color:#776e65}.c4{background:#ede0c8;color:#776e65}
.c8{background:#f2b179;color:#f9f6f2}.c16{background:#f59563;color:#f9f6f2}
.c32{background:#f67c5f;color:#f9f6f2}.c64{background:#f65e3b;color:#f9f6f2}
.c128{background:#edcf72;color:#f9f6f2;font-size:26px}.c256{background:#edcc61;color:#f9f6f2;font-size:26px}
.c512{background:#edc850;color:#f9f6f2;font-size:24px}.c1024{background:#edc53f;color:#f9f6f2;font-size:22px}
.c2048{background:#edc22e;color:#f9f6f2;font-size:22px}.cbig{background:#3c3a32;color:#f9f6f2;font-size:20px}
.msg{min-height:24px;color:#2f5596;font-weight:600;margin-top:12px}
.tip{color:#6b6b70;font-size:13px;margin-top:6px}
button{font:inherit;padding:6px 18px;border:1px solid #c9c9ce;background:#fff;border-radius:6px;cursor:pointer;margin-top:10px}
</style>
</head>
<body>
<div class="top"><a href="index.html">← 小游戏合集</a></div>
<h1>2048</h1>
<p class="info">分数 <b id="score">0</b> · 最高 <b id="best">0</b></p>
<div id="board"></div>
<p class="msg" id="msg"></p>
<p class="tip">方向键 / WASD · 手机滑屏 · 相同数字撞到一起就合并</p>
<button id="new">重新开始</button>
<script>
(function(){
"use strict";
var board,score,best=0,won=false,over=false;
var boardEl=document.getElementById("board"),scoreEl=document.getElementById("score"),
    bestEl=document.getElementById("best"),msgEl=document.getElementById("msg");
function loadBest(){try{best=parseInt(localStorage.getItem("2048_best")||"0",10)||0;}catch(e){best=0;}bestEl.textContent=best;}
function saveBest(){if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem("2048_best",String(best));}catch(e){}}}
function emptyCells(){
  var e=[];for(var i=0;i<16;i++){if(board[i]===0)e.push(i);}return e;
}
function spawn(){
  var e=emptyCells();if(!e.length)return;
  var i=e[Math.floor(Math.random()*e.length)];
  board[i]=(Math.random()<0.9)?2:4;
}
function slide(row){
  var a=row.filter(function(v){return v;}),s=0;
  for(var i=0;i<a.length-1;i++){
    if(a[i]===a[i+1]){a[i]*=2;s+=a[i];a.splice(i+1,1);}
  }
  while(a.length<4)a.push(0);
  return {arr:a,score:s};
}
function move(dir){
  if(over)return;
  var moved=false,gain=0;
  var b=board.slice();
  var idx=function(r,c){
    if(dir===0)return r*4+c;
    if(dir===1)return c*4+r;
    if(dir===2)return r*4+(3-c);
    return (3-r)*4+c;   // 下
  };
  for(var r=0;r<4;r++){
    var row=[b[idx(r,0)],b[idx(r,1)],b[idx(r,2)],b[idx(r,3)]];
    if(dir===1||dir===3)row.reverse();
    var res=slide(row);
    var out=res.arr.slice();
    if(dir===1||dir===3)out.reverse();
    gain+=res.score;
    for(var c=0;c<4;c++){
      var ni=idx(r,c);
      if(b[ni]!==out[c]){moved=true;b[ni]=out[c];}
    }
  }
  if(!moved)return;
  board=b;
  score+=gain;
  scoreEl.textContent=score;
  spawn();
  if(!won){
    for(var i=0;i<16;i++){if(board[i]>=2048){won=true;msgEl.textContent="到 2048 了！还能继续冲";break;}}
  }
  if(!emptyCells().length&&!canMerge()){
    over=true;
    msgEl.textContent="没格子了，结束 · "+score+" 分";
    saveBest();
  }
  draw();
}
function canMerge(){
  for(var r=0;r<4;r++)for(var c=0;c<4;c++){
    var v=board[r*4+c];
    if(c<3&&v===board[r*4+c+1])return true;
    if(r<3&&v===board[(r+1)*4+c])return true;
  }
  return false;
}
function clsOf(v){
  if(v===0)return "cell";
  return "cell c"+(v<=2048?v:"big");
}
function draw(){
  var html="";
  for(var i=0;i<16;i++){
    var v=board[i];
    html+='<div class="'+clsOf(v)+'">'+(v||"")+"</div>";
  }
  boardEl.innerHTML=html;
}
function newGame(){
  board=new Array(16).fill(0);
  score=0;won=false;over=false;
  scoreEl.textContent="0";msgEl.textContent="";
  spawn();spawn();draw();
}
function init(dir){return function(){move(dir);};}
document.addEventListener("keydown",function(e){
  var k=e.key, d=-1;
  if(k==="ArrowLeft"||k==="a"||k==="A")d=0;
  else if(k==="ArrowUp"||k==="w"||k==="W")d=1;
  else if(k==="ArrowRight"||k==="d"||k==="D")d=2;
  else if(k==="ArrowDown"||k==="s"||k==="S")d=3;
  if(d>=0){move(d);e.preventDefault();}
});
var tx=0,ty=0;
boardEl.addEventListener("touchstart",function(e){tx=e.touches[0].clientX;ty=e.touches[0].clientY;e.preventDefault();},{passive:false});
boardEl.addEventListener("touchend",function(e){
  var t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
  if(Math.abs(dx)<24&&Math.abs(dy)<24)return;
  if(Math.abs(dx)>Math.abs(dy))move(dx>0?2:0);
  else move(dy>0?3:1);
  e.preventDefault();
},{passive:false});
document.getElementById("new").addEventListener("click",newGame);
loadBest();newGame();
})();
</script>
</body>
</html>
